tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi làm rõ cho người dùng khi thiếu thông tin hoặc cần xác nhận trước hành động. DÙNG KHI: thiếu tài khoản (handle), thiếu URL, hoặc cần hỏi xác nhận (yes_no) trước khi gửi/đăng bài. KHÔNG DÙNG KHI: đã có đủ thông tin hoặc câu hỏi thông thường ngoài phạm vi."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi gửi cho người dùng."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi: 'text' khi cần xin thông tin (link URL, username); 'yes_no' khi cần người dùng xác nhận trước khi thực hiện hành động (gửi bài); 'choice' khi chọn từ danh sách options."}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn khi response_type là 'choice'."}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng (tweet) gần đây của một tài khoản Twitter/X cụ thể. DÙNG KHI: người dùng muốn xem bài đăng CỦA một người/tài khoản cụ thể. KHÔNG DÙNG KHI: tìm bài đăng theo chủ đề (dùng social_search) hoặc chưa biết rõ tài khoản (phải dùng clarify)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (handle) không chứa ký tự '@' (ví dụ: 'elonmusk', 'sama', 'karpathy')."}
        limit: {type: integer, default: 5, description: "Số lượng tweet cần lấy (mặc định 5)."}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng trên mạng xã hội Twitter/X theo từ khóa hoặc chủ đề. DÙNG KHI: tìm kiếm bài đăng theo CHỦ ĐỀ hoặc dư luận xã hội. KHÔNG DÙNG KHI: lấy bài đăng của một người cụ thể (dùng timeline)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề tìm kiếm trên Twitter."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Kiểu tìm kiếm: 'Latest' (mới nhất) hoặc 'Top' (nổi bật nhất)."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần tìm."}
      required: [query]

  - name: lookup
    description: "Tìm kiếm thông tin tổng hợp hoặc tin tức thời sự trên web qua search engine. DÙNG KHI: tra cứu thông tin trên internet, tìm tin tức mới. KHÔNG DÙNG KHI: người dùng đã đưa ra URL cụ thể (dùng fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm cốt lõi (ví dụ 'AI', 'robotics', 'OpenAI'). QUY ƯỚC QUAN TRỌNG: CHỈ truyền thực thể/chủ đề chính; KHÔNG chèn thêm các từ thời gian hay tin tức như 'news', 'today', 'hôm nay' vào query vì đã có tham số topic và timeframe."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: 'news' cho tin tức/thời sự; 'general' cho thông tin chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian giới hạn tin: 'day' (hôm nay/24h), 'week' (tuần này), 'month' (tháng này), 'year' (năm nay)."}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả tối đa trả về."}
      required: [query]

  - name: fetch
    description: "Đọc và trích xuất nội dung từ một địa chỉ URL trang web cụ thể. DÙNG KHI: người dùng đã cung cấp đường link URL hoặc cần đọc chi tiết một trang web. KHÔNG DÙNG KHI: chưa có URL cụ thể (phải tìm kiếm bằng lookup hoặc hỏi bằng clarify)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ của trang web cần đọc (bắt đầu bằng http:// hoặc https://)."}
      required: [url]

  - name: format
    description: "Trình bày danh sách dữ liệu đã thu thập được thành văn bản/markdown digest theo mẫu. DÙNG KHI: đã có dữ liệu từ các bước trước và cần định dạng tổng hợp cho người dùng."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các item dữ liệu cần định dạng."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Mẫu giao diện digest."}
        headline: {type: string, default: "", description: "Tiêu đề của bản tin digest."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung bản tin/tin nhắn lên kênh Telegram. DÙNG KHI: người dùng ĐÃ XÁC NHẬN rõ ràng việc gửi (confirmed=true). TUYỆT ĐỐI KHÔNG DÙNG KHI: người dùng chưa xác nhận (khi đó PHẢI gọi clarify với response_type='yes_no' để xin xác nhận trước)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung tin nhắn cần gửi lên Telegram."}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận: chỉ được đặt thành true khi người dùng đã đồng ý cho phép gửi."}
      required: [text, confirmed]

  - name: policy
    description: "Tìm kiếm các quy định, chính sách nội bộ của công ty trong knowledge base. DÙNG KHI: câu hỏi liên quan đến quy định công ty, bảo mật, trích dẫn nguồn hoặc xuất bản ra bên ngoài."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tra cứu chính sách."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực chính sách cần tra cứu."}
        top_k: {type: integer, default: 3, description: "Số lượng điều khoản liên quan nhất cần lấy."}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo khoa học trên arXiv theo từ khóa. DÙNG KHI: nghiên cứu học thuật, tìm paper mới."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm bài báo."}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp kết quả."}
      required: [query]

  - name: paper_text
    description: "Tải và trích xuất nội dung văn bản thô từ file PDF của bài báo trên arXiv. DÙNG KHI: đã có ID hoặc URL của bài báo arXiv và cần đọc chi tiết nội dung."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Đường link arXiv hoặc arXiv ID của bài báo."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất."}
        max_chars: {type: integer, default: 8000, description: "Số lượng ký tự tối đa."}
      required: [arxiv_url]

  # ---------------- Team custom tools (CP3) ----------------
  - name: github_search
    description: "Tìm kiếm các kho lưu trữ mã nguồn mở (repositories) trên GitHub theo từ khóa, tên dự án, thư viện hoặc chủ đề kỹ thuật. DÙNG KHI: người dùng muốn tìm code mẫu, repo open-source, thư viện, framework, hoặc mã nguồn trên GitHub. KHÔNG DÙNG KHI: tra cứu tin tức thời sự chung (dùng lookup) hoặc tìm tweet/mạng xã hội (dùng social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc tên dự án/thư viện cần tìm trên GitHub."}
        sort: {type: string, enum: [stars, forks, updated], default: "stars", description: "Tiêu chí sắp xếp: 'stars' (nhiều sao nhất), 'forks', hoặc 'updated'."}
        limit: {type: integer, default: 5, description: "Số lượng repository tối đa cần lấy (mặc định 5, tối đa 30)."}
      required: [query]
