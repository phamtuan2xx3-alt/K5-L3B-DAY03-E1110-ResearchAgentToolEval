tools:
- name: clarify
  description: Gửi một câu hỏi cho người dùng.
  parameters:
    type: object
    properties:
      question:
        type: string
        default: ''
        description: Câu hỏi
      response_type:
        type: string
        enum:
        - text
        - yes_no
        - choice
        default: text
        description: Kiểu trả lời
      options:
        type: array
        default: []
        items:
          type: string
        description: Các lựa chọn
    required:
    - question
- name: timeline
  description: Lấy các bài đăng gần đây.
  parameters:
    type: object
    properties:
      screenname:
        type: string
        default: ''
        description: Tên tài khoản
      limit:
        type: integer
        default: 5
        description: Số lượng
    required:
    - screenname
- name: social_search
  description: Tìm trên mạng xã hội.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Từ khóa
      search_type:
        type: string
        enum:
        - Latest
        - Top
        default: Latest
        description: Cách sắp xếp
      limit:
        type: integer
        default: 5
        description: Số lượng
    required:
    - query
- name: lookup
  description: Tìm thông tin hoặc tin tức trên web theo chủ đề người dùng yêu cầu. Giữ query theo đúng chủ đề; truyền
    loại tin qua topic và khoảng thời gian qua timeframe, không gộp các bộ lọc này vào query.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Chủ đề hoặc từ khóa cốt lõi người dùng cung cấp. Giữ nguyên tên riêng và phạm vi chủ đề; không
          tự thêm từ đồng nghĩa, chủ đề liên quan, news, tin tức, today, hôm nay hoặc mới nhất. Các yêu cầu về loại
          tin và thời gian thuộc topic và timeframe. Trong hội thoại nhiều lượt, dùng chủ đề mới nếu người dùng
          đổi chủ đề; nếu không, kế thừa chủ đề trước.
      topic:
        type: string
        enum:
        - general
        - news
        default: general
        description: Dùng news khi người dùng yêu cầu tin tức, bản tin hoặc cập nhật thời sự; dùng general cho tra
          cứu thông tin thông thường. Kế thừa loại tìm kiếm từ ngữ cảnh nếu người dùng chưa thay đổi.
      timeframe:
        type: string
        enum:
        - day
        - week
        - month
        - year
        default: week
        description: 'Bộ lọc thời gian: day cho hôm nay hoặc 24 giờ qua; week cho tuần này hoặc 7 ngày qua; month
          cho tháng này; year cho năm này. Dùng thời gian mới nhất người dùng yêu cầu; kế thừa từ hội thoại nếu
          chưa có thay đổi. Không thêm bộ lọc thời gian vào query.'
      max_results:
        type: integer
        default: 5
        description: Số kết quả
    required:
    - query
- name: fetch
  description: Lấy nội dung từ một địa chỉ.
  parameters:
    type: object
    properties:
      url:
        type: string
        default: ''
        description: Địa chỉ
    required:
    - url
- name: format
  description: Trình bày dữ liệu đã có thành văn bản.
  parameters:
    type: object
    properties:
      items:
        type: array
        default: []
        description: Danh sách item
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            source:
              type: string
            summary:
              type: string
            section:
              type: string
      template:
        type: string
        enum:
        - brief
        - sections
        - bullets
        - thread
        - daily_ai_vn
        default: sections
        description: Khuôn
      headline:
        type: string
        default: ''
        description: Tiêu đề
    required:
    - items
    - template
- name: send
  description: Gửi một đoạn văn bản đi.
  parameters:
    type: object
    properties:
      text:
        type: string
        default: ''
        description: Nội dung
      confirmed:
        type: boolean
        default: false
        description: Cờ xác nhận
    required:
    - text
- name: policy
  description: Tìm trong tài liệu nội bộ.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Truy vấn
      policy_area:
        type: string
        enum:
        - all
        - ai_research
        - source_citation
        - data_privacy
        - external_publishing
        - tool_usage
        default: all
        description: Nhóm
      top_k:
        type: integer
        default: 3
        description: Số mục
    required:
    - query
- name: papers
  description: Tìm bài báo khoa học.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Từ khóa
      max_results:
        type: integer
        default: 5
        description: Số lượng
      sort_by:
        type: string
        enum:
        - relevance
        - lastUpdatedDate
        - submittedDate
        default: relevance
        description: Sắp xếp
    required:
    - query
- name: paper_text
  description: Lấy nội dung text của một bài báo.
  parameters:
    type: object
    properties:
      arxiv_url:
        type: string
        default: ''
        description: ID hoặc địa chỉ
      max_pages:
        type: integer
        default: 5
        description: Số trang
      max_chars:
        type: integer
        default: 8000
        description: Số ký tự
    required:
    - arxiv_url
- name: deduplicate_sources
  description: Loại nguồn trùng trong danh sách đã thu thập theo URL chuẩn hóa. Dùng trước khi gộp hoặc tổng hợp
    nhiều nguồn. Giữ item đầu tiên; bỏ fragment và tham số tracking khi so sánh. Không tìm nguồn mới hoặc gộp các
    bài chỉ giống tiêu đề.
  parameters:
    type: object
    properties:
      items:
        type: array
        description: Nguồn đã có; mỗi item phải có URL HTTP/HTTPS hợp lệ. Các trường metadata khác được giữ nguyên.
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            source:
              type: string
            summary:
              type: string
          required:
          - url
    required:
    - items
- name: check_citations
  description: Đối chiếu mã trích dẫn dạng [id] hoặc [1, 2] trong bản nháp với danh sách nguồn đã có; trả mã thiếu
    nguồn và nguồn chưa dùng. Dùng để kiểm tra cấu trúc trích dẫn. Không xác minh nội dung hay chất lượng nguồn;
    không tải URL.
  parameters:
    type: object
    properties:
      draft:
        type: string
        description: Bản nháp không rỗng có mã trích dẫn; mã phân biệt hoa thường. Bỏ qua link, ảnh Markdown và
          code trong backtick.
      sources:
        type: array
        description: Danh sách nguồn với id chuỗi duy nhất, chỉ gồm chữ ASCII, số, gạch dưới hoặc gạch ngang; URL
          phải là HTTP/HTTPS.
        items:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            url:
              type: string
          required:
          - id
          - url
    required:
    - draft
    - sources
- name: compare_papers
  description: So sánh metadata được cung cấp của ít nhất hai paper, trả dữ liệu có cấu trúc và bảng Markdown. Dùng
    khi đã có thông tin paper cần đối chiếu. Không tìm kiếm, đọc PDF hoặc tự suy diễn phương pháp và hạn chế chưa
    được cung cấp.
  parameters:
    type: object
    properties:
      papers:
        type: array
        minItems: 2
        description: Mỗi paper cần title. Các trường khác tùy chọn; thiếu dữ liệu được ghi rõ trong bảng.
        items:
          type: object
          properties:
            title:
              type: string
            year:
              type: integer
              minimum: 1000
              maximum: 9999
            authors:
              type: array
              items:
                type: string
            topic:
              type: string
            method:
              type: string
            limitations:
              type: string
            summary:
              type: string
            url:
              type: string
          required:
          - title
      fields:
        type: array
        minItems: 1
        description: Các cột so sánh không trùng nhau; title luôn có. Mặc định year, authors, topic, method, limitations.
        items:
          type: string
          enum:
          - year
          - authors
          - topic
          - method
          - limitations
          - summary
          - url
    required:
    - papers
- name: rank_sources
  description: Xếp hạng nguồn đã thu thập theo mức khớp từ khóa (60%), độ mới (25%) và domain ưu tiên (15%). Dùng
    để chọn nguồn theo tiêu chí minh bạch. Điểm là heuristic, không xác minh độ tin cậy hay tính đúng của nguồn;
    không gọi web.
  parameters:
    type: object
    properties:
      query:
        type: string
        description: Chủ đề cần xếp hạng; phải có từ khóa có nghĩa.
      items:
        type: array
        description: Các nguồn đã có; URL bắt buộc. published_at dùng YYYY-MM-DD, không tự bịa ngày. Nguồn thiếu
          ngày hoặc có ngày tương lai nhận điểm độ mới bằng 0.
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            summary:
              type: string
            published_at:
              type: string
          required:
          - url
      preferred_domains:
        type: array
        default: []
        description: Tên domain ưu tiên, không gồm scheme, path hoặc port; áp dụng cả subdomain. Bỏ qua nếu người
          dùng chưa chỉ định.
        items:
          type: string
      reference_date:
        type: string
        description: Ngày mốc YYYY-MM-DD để tính độ mới và tái lập kết quả. Nếu bỏ qua, dùng ngày local hiện tại
          và trả lại ngày đã dùng.
      limit:
        type: integer
        minimum: 1
        default: 5
        description: Số nguồn tối đa trả về. Các nguồn đồng điểm giữ thứ tự đầu vào.
    required:
    - query
    - items
